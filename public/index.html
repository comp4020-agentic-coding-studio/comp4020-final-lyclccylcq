<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Same Gym</title>
    <meta name="description" content="A shared pixel gym: train on your own, alongside whoever else is in." />
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body class="gym">
    <header class="top">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Same Gym</a>
      <p class="headcount" id="headcount" aria-live="polite"></p>
      <nav>
        <a href="/readme/">About</a>
        <button type="button" class="link" id="pass-button" hidden>Gym pass</button>
      </nav>
    </header>

    <main class="stage">
      <div class="world-scroll" id="world-scroll" tabindex="0" aria-label="The gym floor. Tap any equipment to use it.">
        <div class="world-size" id="world-size">
          <div class="world" id="world">
            <canvas id="world-canvas" aria-hidden="true"></canvas>
            <!-- world.js puts a button over every machine -->
            <div class="hotspots"></div>
            <div class="people" id="people"></div>
          </div>
        </div>
      </div>
      <aside class="panel" id="panel" aria-live="polite" hidden></aside>
    </main>

    <!-- The way in: first visit, or coming back after leaving. -->
    <div class="door" id="door" hidden>
      <div class="door-card" role="dialog" aria-modal="true" aria-labelledby="door-title">
        <div id="door-body"></div>
      </div>
    </div>

    <noscript><p class="noscript">The gym needs JavaScript to draw the room and the people in it.</p></noscript>
  </body>
</html>
